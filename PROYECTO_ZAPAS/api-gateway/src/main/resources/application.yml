server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:        
        - id: usuarios-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/usuario/**

        - id: zapatillas-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/zapatillas/**, /api/v1/marcas/**
        
        - id: pedidos-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/pedidos/**

        - id: pagos-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pagos/**