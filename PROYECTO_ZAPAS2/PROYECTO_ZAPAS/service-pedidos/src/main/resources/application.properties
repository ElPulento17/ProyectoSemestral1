spring.application.name=service-pedidos
server.port=8083

# Conexión a DB Pedidos
spring.datasource.url=jdbc:mysql://localhost:3306/db_pedidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.service.usuarios.url=http://localhost:8081
app.service.zapatillas.url=http://localhost:8082

springdoc.api-docs.path=/api/v1/pedidos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.mvc.cors.allowed-origins=http://localhost:8080
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*