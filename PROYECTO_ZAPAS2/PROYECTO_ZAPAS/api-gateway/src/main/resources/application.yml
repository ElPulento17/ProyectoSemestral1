server:
  port: 8080

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
      
        - id: auth-service
          uri: http://localhost:8091
          predicates:
            - Path=/auth/**

        # servicio de Usuario
        - id: usuarios-docs
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/usuario/v3/api-docs
        - id: usuarios-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/usuario/**
          filters:
            - AuthenticationFilter

        # sservicio de Zapatillas
        - id: zapatillas-docs
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/zapatillas/v3/api-docs
        - id: zapatillas-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/zapatillas/**, /api/v1/marcas/**
          filters:
            - AuthenticationFilter

        # servicio de Pedidos
        - id: pedidos-docs
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/pedidos/v3/api-docs
        - id: pedidos-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/pedidos/**
          filters:
            - AuthenticationFilter

        # servicio de Pagos
        - id: pagos-docs
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pagos/v3/api-docs
        - id: pagos-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pagos/**
          filters:
            - AuthenticationFilter

        # servicio de Envios
        - id: envios-docs
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/envios/v3/api-docs
        - id: envios-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/envios/**
          filters:
            - AuthenticationFilter

        # servicio de reseñas
        - id: resenas-docs
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/resenas/v3/api-docs
        - id: resenas-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/resenas/**
          filters:
            - AuthenticationFilter

        # servicio de Descuentos
        - id: descuentos-docs
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/descuentos/v3/api-docs
        - id: descuentos-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/descuentos/**
          filters:
            - AuthenticationFilter

        # servicio de prooveedores
        - id: proveedores-docs
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/proveedores/v3/api-docs
        - id: proveedores-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/proveedores/**
          filters:
            - AuthenticationFilter

        # servicio de reportes
        - id: reportes-docs
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/reportes/v3/api-docs
        - id: reportes-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/reportes/**
          filters:
            - AuthenticationFilter

        # servicio de Notificaciones
        - id: notificaciones-docs
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/notificaciones/v3/api-docs
        - id: notificaciones-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/notificaciones/**
          filters:
            - AuthenticationFilter

springdoc:
  swagger-ui:
    urls:
      - name: Usuarios
        url: /api/v1/usuario/v3/api-docs

      - name: Zapatillas
        url: /api/v1/zapatillas/v3/api-docs

      - name: Pedidos
        url: /api/v1/pedidos/v3/api-docs

      - name: Pagos
        url: /api/v1/pagos/v3/api-docs

      - name: Envios
        url: /api/v1/envios/v3/api-docs

      - name: Descuentos
        url: /api/v1/descuentos/v3/api-docs

      - name: Notificaciones
